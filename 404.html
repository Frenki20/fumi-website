<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — FUMI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F8F3EB">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>
    document.documentElement.className = 'js';
    setTimeout(function () { if (!window.__fumi) document.documentElement.className = 'no-js'; }, 4000);
  </script>
  <!-- Fonts are self-hosted in assets/fonts (no request to Google) -->
  <link rel="preload" href="/assets/fonts/syne-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <!-- Root-relative paths so this page works at any URL depth on your host -->
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/main.js" defer></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
  </svg>

  <div class="loader" aria-hidden="true"><div class="loader__bar"><span></span></div></div>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="/" aria-label="FUMI — home"><img class="logo__img" src="/assets/logo-fumi.png" alt="FUMI" width="1903" height="480"></a>
    </div>
  </header>

  <main class="error-page" id="main">
    <div>
      <p class="error-page__code" aria-hidden="true">404<span class="hero__dot"></span></p>
      <h1>This page drifted off.</h1>
      <p class="error-page__text">The page you’re looking for doesn’t exist or has moved. Let’s get you back to something great.</p>
      <a class="btn btn--primary btn--icon" href="/">
        <span class="btn__label">Back to home</span>
        <span class="btn__icon" aria-hidden="true"><svg class="icon"><use href="#i-arrow"/></svg><svg class="icon"><use href="#i-arrow"/></svg></span>
      </a>
    </div>
  </main>
</body>
</html>
